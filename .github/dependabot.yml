version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # which 7 only narrows engines to ^22.22.2 || ^24.15.0 || >=26, stricter than our and WebdriverIO's >=22.19.0
    - dependency-name: which
      update-types: ["version-update:semver-major"]

  groups:
    patch-deps-updates-main:
      update-types:
        - "patch"
    minor-deps-updates-main:
      update-types:
        - "minor"
    major-deps-updates-main:
      update-types:
        - "major"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  groups:
    patch-deps-updates:
      update-types:
        - "patch"
    minor-deps-updates:
      update-types:
        - "minor"
    major-deps-updates:
      update-types:
        - "major"
