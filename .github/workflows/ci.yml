name: CI

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

# one run per ref; newer push cancels the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # full matrix on push, including the engines floor; PRs test Node 24 only, for fast feedback
        node: ${{ github.event_name == 'pull_request' && fromJson('[24]') || fromJson('["22.19.0", 22, 24, 26]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 💚 Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: 🚧 Install Dependencies
        run: pnpm ci

      - name: 📦 Build
        run: pnpm run build

      - name: 📦 Check npm packages
        # the tarball is the same on every OS
        if: matrix.os == 'ubuntu-latest'
        run: pnpm -r run check:pack

      - name: 🧪 Run Tests
        run: pnpm test

      - name: 🧪 Run E2E Tests
        run: pnpm run test:e2e
